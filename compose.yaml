
services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: "5000"
      FRONTEND_URL: http://localhost:8080
    expose:
      - "5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - server
